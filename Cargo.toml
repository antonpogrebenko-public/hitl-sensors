[package]
name = "hitl-sensors"
version = "0.3.0"
edition = "2021"
description = "Sensor simulation for HITL drone testing"

[dependencies]
nalgebra = "0.33"
rand = "0.8"

[dev-dependencies]
approx = "0.5"
# default-features = false drops criterion's plotting and rayon stack; the
# benches assert direction and magnitude, not HTML reports.
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "sample"
harness = false
